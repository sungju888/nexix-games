<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXIX 게임·앱</title>
<meta name="description" content="NEXIX가 만든 게임과 앱 모음 — Google Play와 웹에서 바로 즐기세요.">
<meta property="og:title" content="NEXIX 게임·앱">
<meta property="og:description" content="NEXIX가 만든 게임과 앱 모음">
<meta property="og:image" content="img/joseon.png">
<link rel="icon" href="img/joseon.png">
<style>
:root{--bg:#0d1117;--card:#161b26;--line:#262d3d;--text:#eef1f7;--mute:#9099b0;--accent:#3ddc97;--accent2:#ffb547;--accent3:#ff7a90;--blue:#5b8cff}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#f5f7fb;--card:#fff;--line:#e3e7ef;--text:#141924;--mute:#5d6678}
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:44px 16px 64px}
header{margin-bottom:24px}
h1{font-size:30px;letter-spacing:-.03em}
h1 b{color:var(--accent)}
.sub{color:var(--mute);font-size:14.5px;margin-top:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 22px}
.filters button{font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--mute);background:transparent;border:1px solid var(--line);padding:7px 15px;border-radius:99px;transition:.15s}
.filters button:hover{color:var(--text);border-color:var(--mute)}
.filters button.on{color:#06140d;background:var(--accent);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 16px 40px rgba(0,0,0,.25)}
.top{display:flex;gap:14px;align-items:center}
.ico{width:72px;height:72px;border-radius:22%;flex:none;object-fit:cover;box-shadow:0 6px 18px rgba(0,0,0,.3);background:#222a3a;display:grid;place-items:center;font-size:36px}
.card h2{font-size:19px;letter-spacing:-.02em;line-height:1.3}
.genre{font-size:12.5px;color:var(--mute)}
.desc{margin:14px 0;font-size:14.5px;color:var(--mute);flex:1}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--mute) 15%,transparent);color:var(--mute)}
.badge.live{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.badge.review{background:color-mix(in srgb,var(--accent2) 16%,transparent);color:var(--accent2)}
.badge.web{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.actions{display:flex;gap:8px}
.btn{flex:1;text-align:center;font-size:13.5px;font-weight:700;padding:11px 6px;border-radius:12px;border:1px solid var(--line);white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.play{background:var(--accent);border-color:var(--accent);color:#06140d}
.btn.web{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ios{background:var(--text);border-color:var(--text);color:var(--bg)}
.btn:hover{filter:brightness(1.07)}
footer{margin-top:44px;color:var(--mute);font-size:13px;text-align:center}
footer a{color:var(--accent)}
@media(max-width:640px){.grid{grid-template-columns:1fr}.wrap{padding-top:30px}h1{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><b>NEXIX</b> 게임·앱</h1>
    <p class="sub">혼자 만들고 혼자 고치는 작은 게임과 생활 앱. Google Play와 웹에서 바로 즐기세요.</p>
  </header>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <footer>
    문의 <a href="mailto:support@soody.shop">support@soody.shop</a> · <a href="https://soody.date">soody.date</a>
  </footer>
</div>

<script>
/* ▼ 새 게임·앱은 여기에 한 줄만 추가하면 됩니다.
   type: "게임" | "앱" | "현규"   status: live(출시) | review(심사 중) | web(웹 전용) */
const P = id => "https://play.google.com/store/apps/details?id=" + id;
const ITEMS = [
  { name:"조선거상", genre:"상인 시뮬레이션", type:"게임", icon:"img/joseon.png",
    desc:"천민 어부에서 만상까지. 실제 물때와 날씨로 돌아가는 조선 상인 신분 상승 게임.",
    status:"live", play:P("com.nexix.joseon"), ios:"https://apps.apple.com/kr/app/id6811911275", url:"https://joseon.soody.date" },
  { name:"회귀자가 너무 많다: 12년", genre:"회귀 투자 시뮬레이션", type:"게임", icon:"img/regressors.png",
    desc:"31만 명이 동시에 회귀했다. 모두가 같은 미래를 안다면 그 답은 값이 없다 — 3분 실시간 눈치 투자.",
    status:"live", play:P("com.nexix.regressors"), url:"https://regressors.sayblackday.workers.dev" },
  { name:"2회차 회사원", genre:"회귀 직장 RPG", type:"게임", icon:"img/hoegwi.png",
    desc:"내 진짜 직장으로 다시 시작하는 회귀물. 일기토 격투, 미니게임, 익명 게시판까지.",
    status:"live", play:P("com.nexix.hoegwi"), url:"https://hoegwi.soody.date" },
  { name:"썸데이 — 연애 연습", genre:"대화 시뮬레이션", type:"게임", icon:"img/someday.png",
    desc:"선택지 없이 직접 써서 대화하는 연애 연습. 11개국 캐릭터 31명.",
    status:"live", play:P("com.nexix.someday"), url:"https://someday.soody.date" },
  { name:"미러 — 대칭 퍼즐", genre:"두뇌 퍼즐", type:"게임", icon:"img/mirror.png",
    desc:"블록을 옮겨 대칭을 맞추는 두뇌 퍼즐. 대칭 9종, 레벨 200개, 끝없는 거울 모드.",
    status:"live", play:P("com.nexix.mirror"), url:"https://mirror.soody.date" },
  { name:"티끌모아 건물주", genre:"앱테크 · 건물 키우기", type:"게임", icon:"img/tikkeul.png",
    desc:"매일 출석·인증으로 모은 티끌로 건물을 올리는 앱테크 게임.",
    status:"live", play:P("com.nexix.tikkeul"), url:"https://tikkeul.sayblackday.workers.dev/intro/" },
  { name:"물음표 배틀", genre:"실시간 퀴즈", type:"게임", emoji:"❓",
    desc:"AI보다 빨리 맞히고, AI가 못 답하는 질문을 내라. 웹툰 원작 실시간 퀴즈, 8개 언어.",
    status:"web", url:"https://qbattle.soody.date" },
  { name:"마지막 단지", genre:"좀비 타워 디펜스", type:"게임", emoji:"🧟",
    desc:"한국 아파트 단지를 지켜라. 아파트 배경 좀비 타워 디펜스.",
    status:"web", url:"https://danji-2s9.pages.dev" },
  { name:"한국사 한 조각", genre:"교육 · 한국사", type:"앱", icon:"img/hanguksa.png",
    desc:"시대별 한국사를 한 조각씩. 짧게 읽고 퀴즈로 확인하는 한국사 공부.",
    status:"live", play:P("com.ebs.history.edu"), url:"https://hanguksa.pages.dev" },
  { name:"한국사 능력검정 요점정리", genre:"교육 · 시험 대비", type:"앱", icon:"img/hanguksaexam.png",
    desc:"한국사능력검정시험 핵심만 시대순으로. 연표와 오답노트까지.",
    status:"live", play:P("com.naver.history"), url:"https://hanguksa-exam.pages.dev" },
  { name:"수미네 반찬 레시피", genre:"요리 · 레시피", type:"앱", icon:"img/banchan.png",
    desc:"반찬 60가지 레시피와 영양성분, 한 상 균형 추천.",
    status:"live", play:P("com.naver.soomiclass"), url:"https://banchan60.banchan.workers.dev" },
  { name:"사주 인연노트", genre:"운세 · 관계", type:"앱", icon:"img/saju.png",
    desc:"천문 계산 만세력으로 보는 나와 내 사람들의 사주와 인연.",
    status:"review", play:P("com.naver.saju"), url:"https://saju.soody.date" },
  { name:"내보험찾기", genre:"생활 · 보험", type:"앱", icon:"img/naebohum.png",
    desc:"가입한 보험과 중복·과납을 1분 자가진단으로 확인.",
    status:"live", play:P("com.payqube.sample"), url:"https://naebohum.soody.date" },
  { name:"중고 팔기 정리왕", genre:"생활 · 중고거래", type:"앱", icon:"img/jungriwang.png",
    desc:"제품 이름만 치면 전국 실매물 기준 중고 시세. 판매글까지 만들어 준다.",
    status:"live", play:P("com.nexix.jungriwang"), url:"https://jjikpa.pages.dev" },
  { name:"DashCam Viewer", genre:"도구 · 블랙박스", type:"앱", icon:"img/dashcam.png",
    desc:"전용 앱 없이 폰으로 보는 블랙박스 뷰어. 여러 블랙박스 자동 감지.",
    status:"live", play:P("com.nexix.dashcam") },
  { name:"Soody", genre:"쇼핑 · 핸드메이드 주얼리", type:"앱", icon:"img/soody.png",
    desc:"말레이시아·싱가포르 핸드메이드 주얼리 숍 Soody 공식 앱.",
    status:"live", play:P("com.nexix.soody"), url:"https://soody.shop" },
  { name:"현규의 두뇌게임", genre:"두뇌게임 8종", type:"현규", emoji:"🧩",
    desc:"틱택토·사목·오목·리버시·선잇기·길경주·기억력·사탕. 컴퓨터와 하거나 둘이서, 난이도 3단계.",
    status:"web", url:"https://hyungyu-games.pages.dev" },
  { name:"현규의 주판교실", genre:"주판 · 셈하기", type:"현규", emoji:"🧮",
    desc:"만 6세 눈높이 주판 단계별 학습 13단계와 놀이터.",
    status:"web", url:"https://hyungyu-abacus.pages.dev" },
  { name:"소리로 읽는 영어", genre:"파닉스 · 영어 읽기", type:"현규", emoji:"🔤",
    desc:"영국식 발음으로 소리 내어 읽고 듣는 파닉스 연습. (가족용 잠금)",
    status:"web", url:"https://hyungyu-phonics.sayblackday.workers.dev" },
  { name:"현규의 메자스타", genre:"포켓몬 메자스타 도감", type:"현규", emoji:"🎴",
    desc:"메자스타 도감·태그 인식·대진 추천. (가족용 잠금)",
    status:"web", url:"https://hyungyu-mezastar.pages.dev" },
];

const STATUS = { live:["출시","live"], review:["심사 중","review"], web:["웹에서 바로","web"] };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tabs = ["전체","게임","앱","웹에서 바로","현규"];
let cur = "전체";

const card = g => {
  const ico = g.icon ? `<img class="ico" src="${g.icon}" alt="" loading="lazy">` : `<div class="ico" aria-hidden="true">${g.emoji}</div>`;
  const st = STATUS[g.status];
  const plat = [g.play && "Android", g.ios && "iOS", !g.play && g.url && "웹"].filter(Boolean);
  const btn = [
    g.url  && `<a class="btn web"  href="${g.url}"  target="_blank" rel="noopener">${g.play ? "소개 페이지" : "바로 하기"}</a>`,
    g.play && `<a class="btn play" href="${g.play}" target="_blank" rel="noopener">Android</a>`,
    g.ios  && `<a class="btn ios"  href="${g.ios}"  target="_blank" rel="noopener">iOS</a>`,
  ].filter(Boolean).join("");
  return `<article class="card">
    <div class="top">${ico}<div><h2>${esc(g.name)}</h2><div class="genre">${esc(g.genre)}</div></div></div>
    <p class="desc">${esc(g.desc)}</p>
    <div class="badges"><span class="badge ${st[1]}">${st[0]}</span>${plat.map(p=>`<span class="badge">${p}</span>`).join("")}</div>
    <div class="actions">${btn}</div>
  </article>`;
};

function render(){
  $("#filters").innerHTML = tabs.map(t => `<button class="${t===cur?"on":""}" data-t="${t}">${t}</button>`).join("");
  const list = ITEMS.filter(g => cur==="전체" || (cur==="웹에서 바로" ? (g.type!=="현규" && (g.status==="web"||!g.play)) : g.type===cur));
  $("#grid").innerHTML = list.map(card).join("");
}
$("#filters").addEventListener("click", e => { const t = e.target.dataset.t; if (t){ cur = t; render(); } });
render();
</script>
</body>
</html>
